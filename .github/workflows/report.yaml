name: Report

# One-off analysis of any repository: builds the CLI from the current commit,
# runs scan → index → report against the given clone URL and uploads the
# self-contained report.html as a non-zipped artifact, viewable straight from
# the run page in the browser. Handy for sizing up a repository before
# promoting it to examples/.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Clone URL of the repository to analyze
        required: true
        type: string

permissions: {}

jobs:
  report:
    name: Report on ${{ inputs.repo }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      REPO_URL: ${{ inputs.repo }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version-file: .tool-versions

      - name: Install dependencies
        run: pnpm install

      - name: Run pnpm build
        run: pnpm build

      - name: Clone the analyzed repository
        run: git clone --single-branch "$REPO_URL" analyzed

      - name: Run repo-dive scan
        run: node dist/cli.js scan --repo analyzed

      - name: Run repo-dive index
        run: node dist/cli.js index --repo analyzed

      - name: Run repo-dive report
        run: |
          mkdir -p report
          node dist/cli.js report --repo analyzed --out report/index.html

      - name: Derive the artifact name
        id: name
        run: |
          slug=$(basename "${REPO_URL%.git}" | tr -c 'a-zA-Z0-9._-' '-' | sed 's/-*$//')
          echo "slug=${slug:-report}" >> "$GITHUB_OUTPUT"

      - name: Upload the report
        # archive: false keeps index.html non-zipped, so the run page can
        # render it in the browser without a download
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report--${{ steps.name.outputs.slug }}
          path: report/
          archive: false
          retention-days: 30

      - name: Add the report to the job summary
        run: |
          raw=$(du -h report/index.html | cut -f1)
          gzipped=$(gzip -c report/index.html | wc -c)
          {
            echo "Report for \`$REPO_URL\`: $raw raw, $((gzipped / 1024)) kB gzipped."
            echo ""
            echo "Open **report--${{ steps.name.outputs.slug }}** under _Artifacts_ and click \`index.html\` to view it in the browser."
          } >> "$GITHUB_STEP_SUMMARY"
