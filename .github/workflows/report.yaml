name: Report

# One-off analysis of any repository: builds the CLI from the current commit,
# runs scan → index → report against the given clone URL and uploads the
# self-contained report.html as a non-zipped artifact, viewable straight from
# the run page in the browser. Handy for sizing up a repository before
# promoting it to examples/.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Clone URL of the repository to analyze
        required: true
        type: string

permissions: {}

jobs:
  report:
    name: Report on ${{ inputs.repo }}
    runs-on: ubuntu-24.04
    # Heavy histories scan at ~1 commit/s here; the catalog cache below is
    # shared with the examples workflow and makes re-runs resume where the
    # previous one stopped
    timeout-minutes: 350
    env:
      REPO_URL: ${{ inputs.repo }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm and Node.js, install dependencies
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true

      - name: Run pnpm build
        run: pnpm build

      - name: Clone the analyzed repository
        run: git clone --single-branch "$REPO_URL" analyzed

      - name: Derive the artifact name and cache key
        id: name
        run: |
          slug=$(basename "${REPO_URL%.git}" | tr -c 'a-zA-Z0-9._-' '-' | sed 's/-*$//')
          hash=$(printf '%s' "$REPO_URL" | shasum | cut -c1-8)
          echo "slug=${slug:-report}" >> "$GITHUB_OUTPUT"
          echo "cache-prefix=catalog-${slug:-repo}-$hash" >> "$GITHUB_OUTPUT"

      - name: Load the catalog cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.name.outputs.cache-prefix }}-${{ github.run_id }}
          path: analyzed/.repo-dive
          restore-keys: |
            ${{ steps.name.outputs.cache-prefix }}-

      - name: Run repo-dive scan
        # The step (not job) times out, so the cache below is saved either way
        timeout-minutes: 300
        run: node dist/cli.js scan --repo analyzed

      - name: Save the catalog cache
        # Saved before `index` adds the heavy metrics.sqlite to the catalog
        if: ${{ always() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.name.outputs.cache-prefix }}-${{ github.run_id }}
          path: analyzed/.repo-dive

      - name: Run repo-dive index
        run: node dist/cli.js index --repo analyzed

      - name: Run repo-dive report
        # The file name doubles as the artifact name (see the upload step)
        run: |
          mkdir -p report
          node dist/cli.js report --repo analyzed \
            --out "report/report--${{ steps.name.outputs.slug }}.html"

      - name: Upload the report
        # archive: false keeps the report non-zipped, so the run page can
        # render it in the browser without a download. It also makes the file
        # name the artifact name (a `name` input would be ignored), hence the
        # slug in the report file name itself
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: report/
          archive: false
          retention-days: 30

      - name: Add the report to the job summary
        run: |
          report="report/report--${{ steps.name.outputs.slug }}.html"
          raw=$(du -h "$report" | cut -f1)
          gzipped=$(gzip -c "$report" | wc -c)
          {
            echo "Report for \`$REPO_URL\`: $raw raw, $((gzipped / 1024)) kB gzipped."
            echo ""
            echo "Click **report--${{ steps.name.outputs.slug }}.html** under _Artifacts_ to view it in the browser."
          } >> "$GITHUB_STEP_SUMMARY"
