name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  action-smoke-test:
    name: Smoke-test the GitHub Action
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The action runs the CLI published to npm, so this exercises the
      # composite glue in action.yml (input handling, the scan → index →
      # report chain, outputs), not the code built from this commit
      - name: Create a small repository to analyze
        run: |
          git init --quiet --initial-branch=main analyzed
          cd analyzed
          git config user.name "Smoke Test"
          git config user.email "smoke-test@example.com"
          echo 'console.log("one");' > index.js
          git add --all
          git commit --quiet --message "Add index.js"
          echo "# Analyzed" > README.md
          git add --all
          git commit --quiet --message "Add README.md"
          echo 'console.log("two");' >> index.js
          git add --all
          git commit --quiet --message "Extend index.js"

      - name: Run the action
        id: action
        uses: ./
        with:
          repo: analyzed
          cache: false
          upload-artifact: false
          report-path: smoke-test-report.html

      - name: Verify the report
        env:
          REPORT_PATH: ${{ steps.action.outputs.report-path }}
        run: |
          test -s "$REPORT_PATH"
          grep -q "<title>" "$REPORT_PATH"
          du -h "$REPORT_PATH"

  checks:
    name: Run checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm and Node.js, install dependencies
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true

      - name: Load CSpell cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: cspell-${{ github.run_id }}
          path: node_modules/.cache/cspell
          restore-keys: |
            cspell-

      - name: Run pnpm build
        if: ${{ success() || failure() }}
        run: |
          if ! pnpm build; then
            echo ''
            echo ''
            echo 'ℹ️ ℹ️ ℹ️'
            echo 'Please fix the above build errors locally for the check to pass.'
            echo 'ℹ️ ℹ️ ℹ️'
            exit 1
          fi

      - name: Run pnpm lint:cspell
        if: ${{ success() || failure() }}
        run: |
          if ! pnpm lint:cspell; then
            echo ''
            echo ''
            echo 'ℹ️ ℹ️ ℹ️'
            echo 'Please fix the above errors locally for the check to pass.'
            echo 'If you do not see them, try merging target branch into yours.'
            echo 'You can add exceptions to `cspell-words.txt`, if necessary.'
            echo 'ℹ️ ℹ️ ℹ️'
            exit 1
          fi

      - name: Run pnpm lint:eslint
        if: ${{ success() || failure() }}
        run: |
          if ! pnpm lint:eslint; then
            echo ''
            echo ''
            echo 'ℹ️ ℹ️ ℹ️'
            echo 'Try running `pnpm fix:eslint` locally to apply autofixes.'
            echo 'ℹ️ ℹ️ ℹ️'
            exit 1
          fi

      - name: Run pnpm lint:knip
        if: ${{ success() || failure() }}
        run: |
          if ! pnpm lint:knip; then
            echo ''
            echo ''
            echo 'ℹ️ ℹ️ ℹ️'
            echo 'Try running `pnpm fix:knip` locally to apply autofixes.'
            echo 'ℹ️ ℹ️ ℹ️'
            exit 1
          fi

      - name: Run pnpm lint:markdownlint
        if: ${{ success() || failure() }}
        run: |
          if ! pnpm lint:markdownlint; then
            echo ''
            echo ''
            echo 'ℹ️ ℹ️ ℹ️'
            echo 'Try running `pnpm fix:markdownlint` locally to apply autofixes.'
            echo 'ℹ️ ℹ️ ℹ️'
            exit 1
          fi

      - name: Run pnpm lint:pnpm-dedupe
        if: ${{ success() || failure() }}
        run: |
          if ! pnpm lint:pnpm-dedupe; then
            echo ''
            echo ''
            echo 'ℹ️ ℹ️ ℹ️'
            echo 'Some dependencies can be deduplicated, which will make pnpm-lock.yaml'
            echo 'lighter and potentially save us from unexplainable bugs.'
            echo 'Please run `pnpm fix:pnpm-dedupe` locally and commit pnpm-lock.yaml.'
            echo 'ℹ️ ℹ️ ℹ️'
            exit 1
          fi

      - name: Load Prettier cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: prettier-${{ github.run_id }}
          path: node_modules/.cache/prettier
          restore-keys: |
            prettier-

      - name: Run pnpm lint:prettier
        if: ${{ success() || failure() }}
        run: |
          if ! pnpm lint:prettier; then
            echo ''
            echo ''
            echo 'ℹ️ ℹ️ ℹ️'
            echo 'Try running `pnpm fix:prettier` locally to apply autofixes.'
            echo 'ℹ️ ℹ️ ℹ️'
            exit 1
          fi

      - name: Run pnpm lint:tsc
        if: ${{ success() || failure() }}
        run: |
          if ! pnpm lint:tsc; then
            echo ''
            echo ''
            echo 'ℹ️ ℹ️ ℹ️'
            echo 'Please fix the above errors locally for the check to pass.'
            echo 'If you don’t see them, try merging target branch into yours.'
            echo 'ℹ️ ℹ️ ℹ️'
            exit 1
          fi

      - name: Run node dist/cli.js --help
        if: ${{ success() || failure() }}
        run: |
          if ! node dist/cli.js --help; then
            echo ''
            echo ''
            echo 'ℹ️ ℹ️ ℹ️'
            echo 'Please fix the above bundled CLI errors locally for the check to pass.'
            echo 'ℹ️ ℹ️ ℹ️'
            exit 1
          fi

      - name: Run pnpm test
        if: ${{ success() || failure() }}
        run: |
          if ! pnpm test; then
            echo ''
            echo ''
            echo 'ℹ️ ℹ️ ℹ️'
            echo 'Please fix the above test failures locally for the check to pass.'
            echo 'ℹ️ ℹ️ ℹ️'
            exit 1
          fi

      # The baseline is saved by runs on main only, so a pull request compares
      # against the latest main rather than against its own previous run.
      - name: Load npm package size baseline
        if: ${{ success() || failure() }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: package-size-${{ github.run_id }}
          path: node_modules/.cache/package-size
          restore-keys: |
            package-size-

      - name: Run pnpm report-package-size
        if: ${{ success() || failure() }}
        run: |
          if ! pnpm report-package-size; then
            echo ''
            echo ''
            echo 'ℹ️ ℹ️ ℹ️'
            echo 'Measuring the publishable npm package failed.'
            echo 'Try running `pnpm build && pnpm report-package-size` locally.'
            echo 'ℹ️ ℹ️ ℹ️'
            exit 1
          fi

      - name: Save npm package size baseline
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: package-size-${{ github.run_id }}
          path: node_modules/.cache/package-size
