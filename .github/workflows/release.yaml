name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    environment: release
    if: github.repository == 'kachkaev/repo-dive'
    name: Release
    permissions:
      actions: write
      contents: write
      id-token: write
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm and Node.js, install dependencies
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true

      - name: Verify build
        run: pnpm build

      - name: Verify lint
        run: pnpm lint

      - name: Verify bundled CLI
        run: node dist/cli.js --help

      - name: Verify tests
        run: pnpm test

      - name: Create release pull request or publish to npm
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          pr-title: Version packages
          version-script: pnpm changesets:version
          publish-script: pnpm changesets:publish

      - name: Rebuild the example dashboards
        # The release the step above publishes is created with GITHUB_TOKEN, so
        # its `release: published` event starts no workflow runs. Dispatching
        # the examples workflow works because workflow_dispatch is exempt from
        # that rule
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run examples.yaml --ref ${{ github.ref_name }}
