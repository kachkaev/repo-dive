name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    environment: release
    if: github.repository == 'kachkaev/repo-dive'
    name: Release
    permissions:
      actions: write
      contents: write
      id-token: write
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version-file: .tool-versions

      - name: Install dependencies
        run: pnpm install

      - name: Verify build
        run: pnpm build

      - name: Verify lint
        run: pnpm lint

      - name: Verify bundled CLI
        run: node dist/cli.js --help

      - name: Verify tests
        run: pnpm test

      - name: Create release pull request or publish to npm
        id: changesets
        uses: changesets/action@22ccf9aa43179fe9e27dc62e575971d28cce197c # v2.0.0
        with:
          pr-title: Version packages
          version-script: pnpm changesets:version
          publish-script: pnpm changesets:publish

      - name: Rebuild the example dashboards
        # The release the step above publishes is created with GITHUB_TOKEN, so
        # its `release: published` event starts no workflow runs. Dispatching
        # the examples workflow works because workflow_dispatch is exempt from
        # that rule
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run examples.yaml --ref ${{ github.ref_name }}
